kind = "api"
previewPath = "/api"
title = "FastAPI Backend"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd ../.. && uv run uvicorn backend.main:app --host 0.0.0.0 --port 8080"

[services.production]

[services.production.build]
args = ["uv", "sync", "--locked"]

[services.production.run]
args = ["sh", "-c", "cd ../.. && uv run uvicorn backend.main:app --host 0.0.0.0 --port 8080"]

[services.production.health.startup]
path = "/api/healthz"
