openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Backend foundation for safe pedestrian route recommendations

servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health operations
  - name: routes
    description: Route operations

paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /routes:
    post:
      operationId: getRoutes
      tags: [routes]
      summary: Receive a route request
      description: Accepts start and destination coordinates for pedestrian routing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Route request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRequestResponse"

components:
  schemas:
    HealthStatus:
      type: object
      description: Availability status of the backend service
      properties:
        status:
          type: string
        service:
          type: string
      required:
        - status
        - service

    Coordinates:
      type: object
      description: Geographic coordinates
      properties:
        latitude:
          type: number
        longitude:
          type: number
      required:
        - latitude
        - longitude

    RouteRequest:
      type: object
      description: Start and destination coordinates for a route request
      properties:
        start:
          $ref: "#/components/schemas/Coordinates"
        destination:
          $ref: "#/components/schemas/Coordinates"
      required:
        - start
        - destination

    RouteRequestResponse:
      type: object
      description: Confirmation that the route request was received
      properties:
        status:
          type: string
        start:
          $ref: "#/components/schemas/Coordinates"
        destination:
          $ref: "#/components/schemas/Coordinates"
      required:
        - status
        - start
        - destination